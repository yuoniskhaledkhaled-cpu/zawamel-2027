<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زوامل عيسى الليث 2027</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #00c6ff;
            margin-bottom: 15px;
            font-size: 24px;
        }
        p {
            color: #b0b0b0;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 114, 255, 0.3);
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>زوامل عيسى الليث 2027</h1>
        <p>التطبيق يعمل بنجاح تام وجاهز لخدمتكم!</p>
        <button class="btn" onclick="alert('أهلاً بك يا بشمهندس يونس، التطبيق شغال 100%!')">اضغط هنا للاختبار</button>
    </div>

</body>
</html>
